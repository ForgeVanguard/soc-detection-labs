name: ci
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install pytest sigma-cli
          sigma plugin install splunk elasticsearch sysmon windows
      - name: Sigma check and convert
        run: ./scripts/convert-sigma.sh
      - name: Tests
        run: pytest -q
      - name: Shellcheck
        run: shellcheck scripts/*.sh labs/*/detections/*.sh
