name: ci
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          # Pinned to the versions the rules were validated with
          pip install pytest sigma-cli==3.1.0 pySigma==1.5.1 \
            pysigma-backend-splunk==2.1.0 pySigma-backend-elasticsearch==2.1.1 \
            pysigma-pipeline-sysmon==2.0.0 pysigma-pipeline-windows==2.0.1
      - name: Sigma check and convert
        run: ./scripts/convert-sigma.sh
      - name: Tests
        run: pytest -q
      - name: Shellcheck
        run: shellcheck scripts/*.sh labs/*/detections/*.sh
