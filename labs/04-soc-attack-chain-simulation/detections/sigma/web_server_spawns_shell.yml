title: Web Server Process Spawning a Shell
id: f814f499-7e50-5dc5-b2ed-b1ef56dadf67
status: experimental
description: 'A web server or web application runtime starts a shell, which often follows command injection or a web exploit.'
author: Steven Drew
date: 2026-03-01
tags:
    - attack.initial-access
    - attack.t1190
    - attack.execution
    - attack.t1059.004
logsource:
    product: linux
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith:
            - '/apache2'
            - '/httpd'
            - '/nginx'
            - '/php-fpm'
            - '/lighttpd'
    selection_child:
        Image|endswith:
            - '/sh'
            - '/bash'
            - '/dash'
            - '/nc'
            - '/python3'
            - '/perl'
    condition: selection_parent and selection_child
falsepositives:
    - Legitimate CGI scripts or admin panels that shell out (document and filter them)
level: high
