title: WMI Remote Process Execution
id: d2e12eb8-8fec-5576-850a-16bfe7994354
status: experimental
description: 'WmiPrvSE.exe spawning a command shell or PowerShell, as seen with wmic /node process call create and Impacket wmiexec.'
author: Steven Drew
date: 2026-03-01
tags:
    - attack.execution
    - attack.t1047
    - attack.lateral-movement
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        ParentImage|endswith: '\WmiPrvSE.exe'
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
    condition: selection
falsepositives:
    - Management software that runs scripts through WMI
level: high
