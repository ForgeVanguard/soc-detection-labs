title: OS Command Injection Patterns in Web Request
id: e0f3a23e-2c6a-5e02-915d-24b6a3c62547
status: experimental
description: 'Shell metacharacters followed by common recon commands in the query string, as used against DVWA''s Command Injection module.'
author: Steven Drew
date: 2026-03-01
tags:
    - attack.initial-access
    - attack.t1190
    - attack.execution
    - attack.t1059.004
logsource:
    category: webserver
detection:
    selection:
        cs-uri-query|contains:
            - ';id'
            - '%3Bid'
            - '|id'
            - '%7Cid'
            - '&&whoami'
            - '%26%26whoami'
            - ';whoami'
            - '%3Bwhoami'
            - 'cat /etc/passwd'
            - 'cat%20/etc/passwd'
            - 'cat+/etc/passwd'
            - '$('
            - '%24%28'
            - '`'
    condition: selection
falsepositives:
    - Rare; review parameters that accept free text
level: high
