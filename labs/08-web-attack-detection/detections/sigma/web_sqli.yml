title: SQL Injection Patterns in Web Request
id: c60d3ef3-e9df-5b08-8dd6-9d8f6ec586ae
status: experimental
description: 'Common SQL injection strings in the query string, as produced against DVWA''s SQL Injection module (raw and URL-encoded).'
author: Steven Drew
date: 2026-03-01
tags:
    - attack.initial-access
    - attack.t1190
logsource:
    category: webserver
detection:
    selection:
        cs-uri-query|contains:
            - ''' or ''1''=''1'
            - '%27%20or%20%271%27%3D%271'
            - 'union select'
            - 'union%20select'
            - 'union+select'
            - 'information_schema'
            - 'sleep('
            - '@@version'
            - '%27--'
            - '''--'
    condition: selection
falsepositives:
    - Search features where users type SQL keywords
    - Security scanners
level: medium
