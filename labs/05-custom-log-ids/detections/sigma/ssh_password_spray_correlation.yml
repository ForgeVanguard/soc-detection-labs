title: SSH Failed Authentication With Username
id: 01e5e4fe-c84a-5d44-b8db-609961405aae
status: experimental
description: 'Failed SSH authentication with the username field extracted. Base event for the password-spray correlation.'
author: Steven Drew
date: 2026-03-01
tags:
    - attack.credential-access
    - attack.t1110.003
logsource:
    product: linux
    service: auth
detection:
    selection:
        - 'Failed password for '
        - 'Failed keyboard-interactive/pam for '
    condition: selection
falsepositives:
    - Users mistyping passwords
level: informational
---
title: SSH Password Spray - Many Usernames From One Source
id: d00900ca-c368-5f82-8fc7-549ed1f797b6
status: experimental
description: One source IP fails SSH authentication for five or more distinct usernames within one minute. Same logic as the PASSWORD_SPRAY rule in log-brute-force-detector.
author: Steven Drew
date: 2026-03-01
tags:
    - attack.credential-access
    - attack.t1110.003
correlation:
    type: value_count
    rules:
        - 01e5e4fe-c84a-5d44-b8db-609961405aae
    group-by:
        - src_ip
    timespan: 1m
    condition:
        field: user
        gte: 5
falsepositives:
    - Jump hosts where many users mistype passwords at the same time
level: high
