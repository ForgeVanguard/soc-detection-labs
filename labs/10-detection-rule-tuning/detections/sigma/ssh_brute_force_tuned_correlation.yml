title: SSH Brute Force - Tuned (Scanner Allowlist, Higher Threshold)
id: 44945da3-437a-5ecc-92de-7278570d8f19
status: experimental
description: Tuned version of the Lab 01 base rule. Excludes the documented vulnerability scanner and the bastion host. Use it with the tuned correlation (10 failures in 5 minutes).
author: Steven Drew
date: 2026-03-01
tags:
    - attack.credential-access
    - attack.t1110.001
logsource:
    product: linux
    service: auth
detection:
    keywords:
        - 'Failed password for '
        - 'Failed keyboard-interactive/pam for '
    filter_known_sources:
        src_ip:
            - '192.0.2.5'
            - '192.0.2.6'
    condition: keywords and not filter_known_sources
falsepositives:
    - Remaining - document every new one in tuning-log.md
level: informational
---
title: SSH Brute Force - Tuned Correlation
id: 1d0cbe75-a9c5-5a4c-a329-2cfdcf966762
status: experimental
description: Ten or more failures from one source in five minutes, after the scanner and bastion allowlist is applied.
author: Steven Drew
date: 2026-03-01
tags:
    - attack.credential-access
    - attack.t1110.001
correlation:
    type: event_count
    rules:
        - 44945da3-437a-5ecc-92de-7278570d8f19
    group-by:
        - src_ip
    timespan: 5m
    condition:
        gte: 10
falsepositives:
    - Service accounts with expired credentials
level: medium
