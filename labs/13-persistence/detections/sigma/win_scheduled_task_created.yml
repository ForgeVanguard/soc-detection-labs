title: Scheduled Task Created
id: e8f25cda-49c3-5d2a-8882-7223867bd446
status: experimental
description: 'Event 4698: a scheduled task was registered. High volume in some environments, so tune on TaskName and SubjectUserName.'
author: Steven Drew
date: 2026-03-01
tags:
    - attack.persistence
    - attack.execution
    - attack.t1053.005
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4698
    filter_microsoft:
        TaskName|startswith: '\Microsoft\'
    condition: selection and not filter_microsoft
falsepositives:
    - Software installers and updaters
    - Group Policy deployed tasks
level: low
